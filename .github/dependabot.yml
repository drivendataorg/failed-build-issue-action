version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Minor and patch updates arrive as one PR. Majors still individual PRs.
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Dev dependencies arrive as one PR. Every npm update rewrites package-lock.json,
    # so ungrouped updates conflict with each other and each merge forces the rest to
    # rebase. Production dependencies stay ungrouped: they reach dist/index.js, so they
    # need individual review and a rebuilt bundle.
    groups:
      dev-dependencies:
        dependency-type: development
    cooldown:
      default-days: 7
