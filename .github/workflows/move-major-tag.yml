name: release

on:
  release:
    types: [published]

permissions: {}

jobs:
  move-major-tag:
    name: Move major version tag
    # dist/ is committed to the repo, so the released tag is already runnable;
    # this workflow only needs to float the major version tag (e.g. v1) forward.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Move major version tag
        run: |
          TAG="${GITHUB_EVENT_RELEASE_TAG_NAME}"
          MAJOR="${TAG%%.*}"          # v1.2.3 -> v1
          # Dereference to the commit so the major tag never becomes a
          # tag-of-a-tag when the release tag is annotated.
          git tag -f "$MAJOR" "$TAG^{commit}"
          # Checkout runs with persist-credentials: false, so authenticate push inline
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$MAJOR"
        env:
          GITHUB_EVENT_RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
