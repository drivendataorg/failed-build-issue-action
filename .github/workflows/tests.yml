name: "tests"
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage-total: ${{ steps.coverage.outputs.total }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install dependencies
      run: |
        npm ci

    - name: Lint
      run: |
        npm run lint

    - name: Run tests
      run: |
        npm test -- --coverage

    - name: Report coverage
      id: coverage
      run: |
        jq -r --arg root "${GITHUB_WORKSPACE}/" '
          def row($name): "| \($name) | \(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.lines.pct)% |";
          "## Coverage",
          "",
          "| File | Statements | Branches | Functions | Lines |",
          "| --- | ---: | ---: | ---: | ---: |",
          (del(.total) | to_entries | sort_by(.key)[] | .key as $k | .value | row($k | ltrimstr($root))),
          (.total | row("**Total**"))
        ' coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
        echo "total=$(jq '.total.lines.pct | floor' coverage/coverage-summary.json)" >> "$GITHUB_OUTPUT"

    - name: Upload HTML coverage report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-html
        path: coverage/
        if-no-files-found: error

  # Rebuilds the bundle and fails if the committed dist/ is out of date.
  # Because dist/ is committed to the repo, it must be regenerated whenever
  # src/ or dependencies change.
  check-dist:
    name: Check dist/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install dependencies
      run: |
        npm ci

    - name: Rebuild dist/
      run: |
        rm -rf dist/
        npm run build

    # git diff only sees tracked files, so it passes when the build starts
    # emitting a new (untracked) file or stops emitting a committed one.
    # Staging with `git add -A` first makes both cases visible to the diff.
    - name: Compare committed dist/ to rebuild
      run: |
        git add -A dist/
        if ! git diff --cached --exit-code dist/; then
          echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
          exit 1
        fi

  zizmor:
    name: Zizmor audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        advanced-security: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
      with:
        fail-on-scopes: runtime, development, unknown

  all-green:
    name: All green
    if: always()
    needs: [tests, check-dist, zizmor, dependency-review]
    runs-on: ubuntu-latest
    steps:
    - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
      with:
        allowed-skips: dependency-review
        jobs: ${{ toJSON(needs) }}

  coverage-badge:
    name: Publish coverage badge
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push to the badges branch
    steps:
    - name: Push badge data to badges branch
      env:
        COVERAGE_TOTAL: ${{ needs.tests.outputs.coverage-total }}
        TOKEN: ${{ github.token }}
      run: |
        [[ $COVERAGE_TOTAL =~ ^[0-9]+$ ]] || { echo "Unexpected coverage total: '$COVERAGE_TOTAL'"; exit 1; }
        main_sha=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
        if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
          echo "main has moved past ${GITHUB_SHA}; skipping badge update"
          exit 0
        fi
        if (( COVERAGE_TOTAL >= 90 )); then color=brightgreen
        elif (( COVERAGE_TOTAL >= 75 )); then color=yellow
        else color=red
        fi
        git init --quiet --initial-branch=badges badges
        cd badges
        jq -n --arg message "${COVERAGE_TOTAL}%" --arg color "$color" \
          '{schemaVersion: 1, label: "coverage", message: $message, color: $color}' > coverage.json
        git add coverage.json
        git -c user.name="github-actions[bot]" \
          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit --quiet --message "Update coverage badge for ${GITHUB_SHA}"
        git push --force --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  notify:
    name: Notify failed build
    needs: [tests, check-dist, zizmor, coverage-badge]
    if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
