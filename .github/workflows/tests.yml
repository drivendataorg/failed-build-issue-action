name: "tests"
on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install dependencies
      run: |
        npm ci

    - name: Lint
      run: |
        npm run lint

    - name: Run tests
      run: |
        npm test

  # Rebuilds the bundle and fails if the committed dist/ is out of date.
  # Because dist/ is committed to the repo, it must be regenerated whenever
  # src/ or dependencies change.
  check-dist:
    name: Check dist/
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: npm

    - name: Install dependencies
      run: |
        npm ci

    - name: Rebuild dist/
      run: |
        rm -rf dist/
        npm run build

    # git diff only sees tracked files, so it passes when the build starts
    # emitting a new (untracked) file or stops emitting a committed one.
    # Staging with `git add -A` first makes both cases visible to the diff.
    - name: Compare committed dist/ to rebuild
      run: |
        git add -A dist/
        if ! git diff --cached --exit-code dist/; then
          echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
          exit 1
        fi

  zizmor:
    name: Zizmor audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
      with:
        advanced-security: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
      with:
        fail-on-scopes: runtime, development, unknown

  all-green:
    name: All green
    if: always()
    needs: [tests, check-dist, zizmor, dependency-review]
    runs-on: ubuntu-latest
    steps:
    - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
      with:
        allowed-skips: dependency-review
        jobs: ${{ toJSON(needs) }}

  notify:
    name: Notify failed build
    needs: [tests, check-dist, zizmor]
    if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
